<div class="login-container">
  <div class="login-box">
    <h1>StayHn - Iniciar Sesión</h1>
    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" [(ngModel)]="loginData.email" name="email" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" [(ngModel)]="loginData.password" name="password" required />
      </div>
      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
      <button type="submit" [disabled]="isLoading">{{ isLoading ? 'Iniciando...' : 'Iniciar Sesión' }}</button>
    </form>
    <p><a routerLink="/register">¿No tienes cuenta? Regístrate aquí</a></p>
  </div>
</div>
